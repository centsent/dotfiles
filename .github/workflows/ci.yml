name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      build_homes:
        description: Build complete home generations on Linux and Intel macOS
        type: boolean
        default: false

jobs:
  lint-ansible:
    runs-on: ubuntu-latest
    env:
      ANSIBLE_CONFIG: ${{ github.workspace }}/ansible/ansible.cfg
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          pip install -r requirements-dev.txt
          ansible-galaxy collection install -r ansible/requirements.yml -p .ansible/collections

      - name: Lint YAML files
        run: |
          yamllint ansible/

      - name: Lint Ansible playbooks
        run: |
          ansible-lint ansible/

      - name: Validate playbook syntax for both inventories
        run: make syntax

      - name: Test provisioning and migration with temporary files
        run: python3 -m unittest discover -s tests -v

  lint-nix:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nix
    steps:
      - uses: actions/checkout@v7

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Format check
        run: |
          nix fmt -- --check .

      - name: Check Nix flake
        run: |
          nix flake check

      - name: Test Git helpers and effective home configurations
        run: |
          nix shell --inputs-from . nixpkgs#python3 nixpkgs#zsh nixpkgs#git \
            --command python3 -m unittest discover -s tests -v

  build-homes:
    if: github.event_name == 'workflow_dispatch' && inputs.build_homes
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            host: gentoo
          - runner: macos-15-intel
            host: macosx
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Build the native home generation without activation
        working-directory: nix
        run: nix build --no-link ".#homeConfigurations.${{ matrix.host }}.activationPackage"

  check-secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Guards the one real risk here: committing the secrets file before SOPS
      # has encrypted it. Every value must be an ENC[...] blob.
      - name: Verify secrets file is encrypted
        run: |
          file=ansible/group_vars/all/secrets.sops.yaml
          if ! grep -q '^sops:' "$file"; then
            echo "::error file=$file::missing SOPS metadata - committed unencrypted?"
            exit 1
          fi
          if sed '/^sops:/,$d' "$file" \
              | grep -nE ':[[:space:]]*[^[:space:]]' | grep -v 'ENC\['; then
            echo "::error file=$file::plaintext values found above the sops block"
            exit 1
          fi
          echo "OK: all values encrypted"
