# Kitty keymap.
#
# The design constraint is that Hyprland owns SUPER (see
# hypr/config/binds.lua — SUPER+RETURN, +Q, +D, +E, +1..0, +SHIFT+hjkl, ...),
# so nothing here uses it. That leaves ctrl+shift as the prefix, which is also
# kitty's own default modifier and ghostty's on Linux.
#
# A handful of keys are deliberately identical to ghostty/keybinds.conf so the
# muscle memory transfers between the two terminals:
#
#   ctrl+shift+o / ctrl+shift+e   split right / split down
#   ctrl+alt+hjkl                 move between splits
#   ctrl+alt+shift+hjkl           resize the split
#   ctrl+alt+=                    equalise splits
#   ctrl+shift+enter              zoom the split
#   ctrl+shift+t / ctrl+shift+w   new tab / close this pane
#   alt+1..9                      jump to tab N
#   ctrl+= / ctrl+- / ctrl+0      font size
#
# Everything not listed in this file keeps kitty's default binding; run
# ctrl+shift+f6 to dump the resolved config, or ctrl+shift+f3 for the command
# palette, which is searchable and lists every action with its key.

kitty_mod ctrl+shift

# ----------------------------------------------------------------- Splits
# kitty calls these "windows". vsplit puts the new one beside the current one,
# hsplit below it — named for the axis of the divider, not the arrangement.
# --cwd=current is the whole point: a split should open where you already are.
map kitty_mod+o launch --location=vsplit --cwd=current
map kitty_mod+e launch --location=hsplit --cwd=current

# These two override kitty defaults:
#   kitty_mod+o was pass_selection_to_program (open the selection in $BROWSER)
#   kitty_mod+e was open_url_with_hints, rebound onto the hints chord below.
map kitty_mod+p>u open_url_with_hints

# Directional movement, on ctrl+alt rather than ctrl+shift because
# ctrl+shift+h/j/k/l are kitty's scrollback and layout keys and are worth
# keeping. ctrl+alt+arrows is also ghostty's own default for this.
map ctrl+alt+h neighboring_window left
map ctrl+alt+j neighboring_window down
map ctrl+alt+k neighboring_window up
map ctrl+alt+l neighboring_window right
map ctrl+alt+left  neighboring_window left
map ctrl+alt+down  neighboring_window down
map ctrl+alt+up    neighboring_window up
map ctrl+alt+right neighboring_window right

map ctrl+alt+shift+h resize_window narrower 2
map ctrl+alt+shift+j resize_window taller 2
map ctrl+alt+shift+k resize_window shorter 2
map ctrl+alt+shift+l resize_window wider 2
map ctrl+alt+equal reset_window_sizes

# Zoom: `stack` shows one window full-size, toggling back restores the split
# arrangement untouched. Replaces the default new_window on this key, which
# ctrl+shift+o and ctrl+shift+e now cover with a cwd.
map kitty_mod+enter toggle_layout stack

# Swap the focused split with another, picked by an on-screen letter.
map kitty_mod+f8 swap_with_window

# ----------------------------------------------------------------- Tabs
# _with_cwd, matching ghostty's window-inherit-working-directory = true.
map kitty_mod+t new_tab_with_cwd
map kitty_mod+n new_os_window_with_cwd

# alt+N to reach a tab, mirroring ghostty's defaults. kitty's own
# ctrl+shift+1..9 stays on "focus the Nth split", which is the more useful
# pairing once both tabs and splits are in play.
map alt+1 goto_tab 1
map alt+2 goto_tab 2
map alt+3 goto_tab 3
map alt+4 goto_tab 4
map alt+5 goto_tab 5
map alt+6 goto_tab 6
map alt+7 goto_tab 7
map alt+8 goto_tab 8
map alt+9 goto_tab 9

# ----------------------------------------------------------------- Font size
# ctrl+= / ctrl+- / ctrl+0 are ghostty's defaults; kitty's own
# ctrl+shift+= / ctrl+shift+- / ctrl+shift+backspace still work too.
map ctrl+equal  change_font_size all +1.0
map ctrl+minus  change_font_size all -1.0
map ctrl+0      change_font_size all 0

# ----------------------------------------------------------------- Scrollback
# Defaults, restated because they are the reason shell_integration is on:
#   kitty_mod+h  browse the scrollback in a pager
#   kitty_mod+g  browse the output of the last command alone
#   kitty_mod+z  / kitty_mod+x  jump to the previous / next shell prompt
#   kitty_mod+/  search the scrollback
# Added here: put the last command's output on the clipboard, which is the
# thing you actually want when pasting an error into a chat or an editor.
map kitty_mod+alt+g copy_last_command_output

# ----------------------------------------------------------------- Hints
# The hints kitten overlays letters on matching text and pastes what you pick.
# kitty's defaults live under the kitty_mod+p chord (f = path, shift+f = path
# in an editor, l = line, w = word, h = hash, n = line number, y = hyperlink);
# only the two below are additions.
map kitty_mod+p>i kitten hints --type ip --program -
map kitty_mod+p>e kitten hints --type regex --regex '[\w.+-]+@[\w.-]+\.\w+' --program -

# ----------------------------------------------------------------- Misc
# Reload after editing this file. kitty_mod+comma is move_tab_backward, so
# this cannot mirror ghostty's ctrl+shift+comma; f5 is kitty's own default.
map kitty_mod+f5 load_config_file
map kitty_mod+f2 edit_config_file

# Type into every split at once — the reason to have splits open onto several
# hosts in the first place. Press again to leave broadcast mode.
map kitty_mod+alt+b launch --allow-remote-control kitty +kitten broadcast
