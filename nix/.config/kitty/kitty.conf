# Kitty — the second terminal, now full-featured. Waybar clicks open
# `kitty yazi` and `kitty btop` here, and hypr/config/rules.lua floats every
# kitty window and parks it on workspace 6.
#
# Shares its look with alacritty/ and ghostty/: Catppuccin Mocha, FiraCode
# Nerd Font Mono at 16, 12px padding, 0.85 alpha. It also shares a keymap
# with ghostty/ — see keymap.conf, which documents the handful of keys the
# two terminals deliberately agree on.
#
# No multiplexer here on purpose: kitty's own tabs and splits cover what tmux
# would, and tmux already owns alacritty. Wrapping a one-shot tool window in a
# session manager only gets in the way.

include mocha.conf
include keymap.conf

# Machine-local overrides. home.file recursive symlinks each file
# individually, so ~/.config/kitty is a real directory and a hand-written
# local.conf sits beside the links without this repo ever seeing it.
# globinclude rather than include because a glob that matches nothing is
# silent, whereas a plain include of a missing file warns on every start.
globinclude local.conf

# ----------------------------------------------------------------- Font
# The family is "FiraCode", not "Fira Code" — the spaced spelling silently
# falls back to the fontconfig default instead of erroring.
font_family      FiraCode Nerd Font Mono
bold_font        auto
italic_font      auto
bold_italic_font auto
# 16 to match alacritty and ghostty. This used to be 13, which made the three
# terminals visibly different sizes despite the comments claiming otherwise.
font_size        16.0

# Ligatures everywhere except under the cursor, where a merged glyph hides
# which character you are actually sitting on.
disable_ligatures cursor

# A little air between rows, matching alacritty's font.offset.y and ghostty's
# adjust-cell-height.
modify_font cell_height 110%

# ----------------------------------------------------------------- Window
# Alpha lives here rather than in a Hyprland rule; a rule would multiply with
# this rather than replace it. Hyprland's global 0.90 still applies on top.
background_opacity 0.85
window_padding_width 12
hide_window_decorations yes

# The waybar buttons launch yazi and btop straight into a window; a close
# confirmation on a tool window is pure friction.
confirm_os_window_close 0

# Sized for a floating window rather than a tiled one — the old 1920x1080
# covered the whole screen, which defeats the float rule.
remember_window_size no
initial_window_width  1280
initial_window_height 800

# ----------------------------------------------------------------- Layouts
# Only two, and in this order: `splits` is the startup layout (first wins) and
# is the only one that gives directional navigation; `stack` exists purely as
# the zoom target for ctrl+shift+enter. The other built-in layouts (tall, fat,
# grid, horizontal, vertical) are reachable by nothing in this keymap, so
# leaving them enabled would only make ctrl+shift+l cycle through dead ends.
# split_axis=horizontal makes the very first split side-by-side, which suits a
# 1280-wide window better than stacking.
enabled_layouts splits:split_axis=horizontal,stack

# Splits are told apart by a border plus a title bar rather than by colour
# alone. window_title_bar_min_windows 2 keeps a single unsplit window clean.
window_border_width 1pt
draw_minimal_borders yes
window_title_bar_min_windows 2
window_title_bar top
# Dim the splits that are not focused, mirroring ghostty's
# unfocused-split-opacity. Subtle on purpose — this window is already at 0.85
# alpha, so anything stronger makes inactive splits unreadable.
inactive_text_alpha 0.85

# ----------------------------------------------------------------- Tabs
# min_tabs 2 preserves the old "one window, one job" look: the bar simply is
# not there until a second tab exists, so `kitty btop` still opens bare.
tab_bar_style powerline
tab_powerline_style slanted
tab_bar_min_tabs 2
tab_bar_edge top
tab_bar_align left
# The index is worth the width: alt+1..9 jumps straight to it (keymap.conf).
tab_title_template "{index}: {title}"
active_tab_font_style bold
tab_activity_symbol "● "
tab_title_max_length 24

# ----------------------------------------------------------------- Cursor
cursor_shape block
cursor_blink_interval 0.6
# Blink forever rather than settling — a still block cursor in a translucent
# window is easy to lose.
cursor_stop_blinking_after 0
mouse_hide_wait 2.0

# The cursor trail is not decoration: in a split layout, a jump between panes
# is otherwise invisible until you type. 3ms means the trail only fires for
# cursors that actually settled, not for the ones TUIs whip around mid-redraw.
cursor_trail 3
cursor_trail_decay 0.1 0.4
cursor_trail_start_threshold 2

# ----------------------------------------------------------------- Scrollback
# 100k lines rather than 10k — with shell integration, ctrl+shift+g pulls up a
# single command's output, and that is only useful if the command is still in
# the buffer. The pager stays at kitty's default (less), which already handles
# the colour escapes; history_size is the on-disk spill in MB.
scrollback_lines 100000
scrollback_pager_history_size 64
scrollbar scrolled

# ----------------------------------------------------------------- Shell
# Shell integration is what makes ctrl+shift+z/x (jump between prompts),
# ctrl+shift+g (last command output) and notify_on_cmd_finish work at all.
shell_integration enabled

# A desktop notification when a command that ran 15s+ finishes in a window you
# are not looking at. This is the whole reason to run a build in the floating
# kitty rather than in the tmux session.
notify_on_cmd_finish unfocused 15.0

# ----------------------------------------------------------------- URLs
detect_urls yes
url_style curly
underline_hyperlinks hover
# Show where an OSC 8 hyperlink actually points before you click it.
show_hyperlink_targets yes
allow_hyperlinks yes

# ----------------------------------------------------------------- Input
copy_on_select no
strip_trailing_spaces smart
clear_selection_on_clipboard_loss yes
# Paths, flags and URLs survive a double-click intact.
select_by_word_characters @-./_~?&=%+#

# Pasting is the one place a terminal will happily run code for you: confirm
# anything carrying control codes or spanning multiple lines, and quote URLs
# so a stray `?` does not glob at the prompt.
paste_actions quote-urls-at-prompt,confirm,confirm-if-large

# ----------------------------------------------------------------- Remote control
# socket-only, not `yes`: a program inside a window (including anything you
# ssh into) cannot drive kitty over the TTY, but local tools reaching the
# abstract socket can. This is what `kitten @ ...` and editor integrations use.
allow_remote_control socket-only
listen_on unix:@mykitty

# ----------------------------------------------------------------- Bell
# Silent and invisible, matching alacritty. btop and yazi both ring on
# ordinary key presses, which is also why bell_on_tab stays off — it would
# mark a background tab permanently. The activity dot already covers "this
# tab did something", and notify_on_cmd_finish covers the case worth knowing.
enable_audio_bell no
visual_bell_duration 0
bell_on_tab none

# ----------------------------------------------------------------- Updates
# Packaged by the distro (/usr/bin/kitty), so the built-in update check has
# nothing to offer but a notification.
update_check_interval 0

# ----------------------------------------------------------------- Shell program
# Left unset on purpose: kitty starts the user's login shell (zsh) by default.
# This slot used to hold `zellij`, which fought with the tmux session alacritty
# opens and was the only place zellij appeared in the whole config.
