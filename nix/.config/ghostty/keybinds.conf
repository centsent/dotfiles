# Ghostty keymap.
#
# Ghostty's Linux defaults are already good, so this file only does three
# things: bind what has no default (quick terminal, scrollback pager),
# add the vim-direction aliases, and fix the two places where Ghostty's
# defaults disagree with kitty's in a way that costs you work.
#
# Hyprland owns SUPER (see hypr/config/binds.lua), so nothing here uses it —
# and Ghostty's own super+ctrl+... split-resize defaults are re-bound below
# onto keys the compositor cannot swallow.
#
# Shared with kitty/keymap.conf:
#
#   ctrl+shift+o / ctrl+shift+e   split right / split down   (Ghostty default)
#   ctrl+alt+hjkl                 move between splits
#   ctrl+alt+shift+hjkl           resize the split
#   ctrl+alt+=                    equalise splits
#   ctrl+shift+enter              zoom the split             (Ghostty default)
#   ctrl+shift+t / ctrl+shift+w   new tab / close this pane
#   alt+1..9                      jump to tab N              (Ghostty default)
#   ctrl+= / ctrl+- / ctrl+0      font size                  (Ghostty default)
#
# `ghostty +list-keybinds` prints the resolved set.

# ----------------------------------------------------------------- Splits
# Ghostty binds ctrl+alt+arrows for this already; hjkl is the same action.
keybind = ctrl+alt+h=goto_split:left
keybind = ctrl+alt+j=goto_split:down
keybind = ctrl+alt+k=goto_split:up
keybind = ctrl+alt+l=goto_split:right

# The defaults for resizing are super+ctrl+shift+arrows, and SUPER belongs to
# Hyprland. Same modifier layout as kitty's resize keys.
keybind = ctrl+alt+shift+h=resize_split:left,10
keybind = ctrl+alt+shift+j=resize_split:down,10
keybind = ctrl+alt+shift+k=resize_split:up,10
keybind = ctrl+alt+shift+l=resize_split:right,10
keybind = ctrl+alt+equal=equalize_splits

# ----------------------------------------------------------------- Tabs
# Ghostty's default puts `quit` on ctrl+shift+q while kitty puts close_tab
# there — one keystroke apart from losing every window in the wrong terminal.
# Both now close, and quit moves out of the way of a typo.
keybind = ctrl+shift+q=close_tab
keybind = ctrl+alt+shift+q=quit
# close_surface, not close_tab: closes the focused split if there is one, and
# the tab only when it is the last split. Matches kitty's ctrl+shift+w.
keybind = ctrl+shift+w=close_surface

# ----------------------------------------------------------------- Scrollback
# Ghostty has no built-in pager, so these dump the buffer to a temp file and
# hand it to the desktop's default handler. Same keys as kitty's pager
# bindings: h for the whole scrollback, g for the visible screen.
keybind = ctrl+shift+h=write_scrollback_file:open
keybind = ctrl+shift+g=write_screen_file:open
# Ghostty has no equivalent of kitty's copy_last_command_output — the
# scrollback file above, or plain ctrl+shift+c on a selection, is the way.

# Jump between shell prompts (needs shell-integration, which config sets).
# Ghostty's defaults are ctrl+shift+page_up/page_down; these mirror kitty.
keybind = ctrl+shift+z=jump_to_prompt:-1
keybind = ctrl+shift+x=jump_to_prompt:1

# ----------------------------------------------------------------- Quick terminal
# `global:` asks the compositor for a system-wide shortcut through the
# GlobalShortcuts portal, so it fires even when Ghostty is not focused — that
# is the entire point of a drop-down terminal. On Hyprland this needs
# xdg-desktop-portal-hyprland running; if the portal is unavailable the bind
# is simply inert, and the non-global alias below still works from inside
# Ghostty. The alternative is a Hyprland bind calling
# `ghostty +new-window --quick-terminal` from hypr/config/binds.lua.
keybind = global:ctrl+grave_accent=toggle_quick_terminal
keybind = ctrl+shift+grave_accent=toggle_quick_terminal

# ----------------------------------------------------------------- Misc
# ctrl+shift+comma reloads (Ghostty default) and ctrl+comma opens the config;
# kitty cannot mirror the first because ctrl+shift+comma is move_tab_backward
# there, so it uses F5 instead.
keybind = ctrl+shift+f5=reload_config
