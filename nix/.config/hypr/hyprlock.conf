# hyprlock — Catppuccin Mocha, centred stack.
#
# The previous version referenced $text_color, $text and $font_family without
# ever defining them; hyprlang leaves an undefined variable as the literal
# string, so those labels were being handed "$text_color" as a colour. Every
# variable used here is declared below.

# ---------------------------
# Palette
# ---------------------------
$crust    = rgba(11111bff)
$base     = rgba(1e1e2eff)
$surface1 = rgba(45475aff)
$overlay1 = rgba(7f849cff)
$subtext0 = rgba(a6adc8ff)
$text     = rgba(cdd6f4ff)
$mauve    = rgba(cba6f7ff)
$blue     = rgba(89b4faff)
$peach    = rgba(fab387ff)
$red      = rgba(f38ba8ff)

# Must match an installed family exactly. The old config spelled this
# "JetBrains Mono Nerd Font" on one label and "JetBrainsMono Nerd Font" on the
# others; only the second matches anything installed.
$font = JetBrainsMono Nerd Font

general {
    hide_cursor = true
    grace = 0
}

# ---------------------------
# Background
# ---------------------------
background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 8
    brightness = 0.45
    contrast = 0.9
    vibrancy = 0.15
    vibrancy_darkness = 0.0
    noise = 0.012

    # hyprlock falls back to this colour if the compositor offers no screencopy
    # support, in which case path=screenshot silently does nothing.
    color = $crust
}

# ---------------------------
# Centred stack
# ---------------------------
# Time, date, user and the password field share one vertical axis. Offsets are
# measured from the centre of the screen, largest first.

# Time
label {
    monitor =
    text = $TIME
    color = $text
    font_size = 96
    font_family = $font
    position = 0, 230
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 6
    shadow_color = rgba(11111b99)
}

# Date
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B %Y"
    color = $subtext0
    font_size = 18
    font_family = $font
    position = 0, 145
    halign = center
    valign = center
}

# Username
label {
    monitor =
    text = $USER
    color = $mauve
    font_size = 15
    font_family = $font
    position = 0, 88
    halign = center
    valign = center
}

# ---------------------------
# Input field
# ---------------------------
input-field {
    monitor =
    size = 320, 52
    outline_thickness = 2
    dots_size = 0.26
    dots_spacing = 0.30
    dots_center = true
    dots_rounding = -1
    outer_color = $surface1
    inner_color = $base
    font_color = $text

    # The old config faded the field out after a second of no typing. In a
    # centred stack that just leaves a hole, so it stays put.
    fade_on_empty = false
    fade_timeout = 1000

    placeholder_text = <i>Password</i>
    hide_input = false
    rounding = 12

    check_color = $blue
    fail_color = $red
    fail_text = <i>$FAIL ($ATTEMPTS)</i>
    fail_transition = 200

    capslock_color = $peach
    numlock_color = -1
    bothlock_color = -1
    invert_numlock = false
    swap_font_color = false

    position = 0, -20
    halign = center
    valign = center
}

# ---------------------------
# Uptime, tucked out of the way
# ---------------------------
label {
    monitor =
    text = cmd[update:60000] uptime -p
    color = $overlay1
    font_size = 12
    font_family = $font
    position = 30, 25
    halign = left
    valign = bottom
}
