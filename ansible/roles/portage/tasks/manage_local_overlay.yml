---
- name: Ensure local repository directory exists
  become: true
  ansible.builtin.file:
    path: /var/db/repos/local
    state: directory
    mode: '0755'

- name: Synchronize local overlay to /var/db/repos/local
  become: true
  ansible.builtin.copy:
    src: local_overlay/
    dest: /var/db/repos/local/
    owner: root
    group: root
    mode: '0644'
    directory_mode: '0755'
  notify: Regenerate local overlay manifest

- name: Configure local portage overlay
  become: true
  ansible.builtin.copy:
    dest: /etc/portage/repos.conf/local.conf
    content: |
      [local]
      location = /var/db/repos/local
      masters = gentoo
      auto-sync = no
    mode: '0644'

# The manifest is regenerated by a handler, so it only runs when the ebuilds
# actually changed rather than on every play.
