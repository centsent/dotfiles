---
- name: Validate migration paths
  ansible.builtin.assert:
    that:
      - migrate_storage_kvm_source_dir is match('^/.+')
      - migrate_storage_kvm_target_dir is match('^/.+')
      - not migrate_storage_kvm_source_dir.endswith('/')
      - not migrate_storage_kvm_target_dir.endswith('/')
      - migrate_storage_kvm_source_dir != migrate_storage_kvm_target_dir
      - not migrate_storage_kvm_target_dir.startswith(migrate_storage_kvm_source_dir + '/')
      - not migrate_storage_kvm_source_dir.startswith(migrate_storage_kvm_target_dir + '/')
      - migrate_storage_kvm_target_dir != migrate_storage_kvm_source_dir + '.pre-migration'
      - not migrate_storage_kvm_target_dir.startswith(migrate_storage_kvm_source_dir + '.pre-migration/')
      - migrate_storage_distfiles_source_dir is match('^/.+')
      - migrate_storage_distfiles_target_dir is match('^/.+')
      - not migrate_storage_distfiles_source_dir.endswith('/')
      - not migrate_storage_distfiles_target_dir.endswith('/')
      - migrate_storage_distfiles_source_dir != migrate_storage_distfiles_target_dir
      - not migrate_storage_distfiles_target_dir.startswith(migrate_storage_distfiles_source_dir + '/')
      - not migrate_storage_distfiles_source_dir.startswith(migrate_storage_distfiles_target_dir + '/')
    fail_msg: Migration source and target directories must be distinct, non-overlapping absolute paths.

- name: Inspect VM storage
  become: true
  ansible.builtin.stat:
    path: "{{ migrate_storage_kvm_source_dir }}"
    follow: false
  register: migrate_storage_kvm_dir_stat

- name: Validate existing VM storage link
  ansible.builtin.assert:
    that:
      - migrate_storage_kvm_dir_stat.stat.lnk_source == migrate_storage_kvm_target_dir
    fail_msg: The existing VM storage symlink points elsewhere; refusing to replace it.
  when: migrate_storage_kvm_dir_stat.stat.islnk | default(false)

- name: Migrate VM storage while preserving service state
  ansible.builtin.import_tasks: kvm.yml
  when:
    - migrate_storage_kvm_dir_stat.stat.isdir | default(false)
    - not ansible_check_mode

- name: Describe VM migration in check mode
  ansible.builtin.debug:
    msg: "Would migrate {{ migrate_storage_kvm_source_dir }} to {{ migrate_storage_kvm_target_dir }}."
  when:
    - ansible_check_mode
    - migrate_storage_kvm_dir_stat.stat.isdir | default(false)

- name: Copy the old Portage cache
  ansible.builtin.import_tasks: distfiles.yml
